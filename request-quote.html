<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="origin"><title>Request a Photo Booth Quote | Photo Booths of Dallas</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f6f7f9;color:#252b36}main{max-width:680px;margin:40px auto;padding:32px;background:#fff;border-radius:18px;box-shadow:0 5px 25px #0001}h1,h2{text-align:center}h1{font-size:27px;margin-bottom:4px}h2{font-size:21px;margin-top:0}p.intro{text-align:center;color:#626a75}label{display:block;font-weight:600;margin:18px 0 6px}input,select,textarea{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #b9c0ca;border-radius:8px}textarea{min-height:100px}button{margin-top:22px;width:100%;background:#172b52;color:white;border:0;border-radius:8px;padding:15px;font-size:17px;cursor:pointer}.small{text-align:center;font-size:13px;color:#626a75}fieldset{border:0;padding:0;margin:0}legend{font-weight:600;margin:18px 0 6px}.choices label{display:block;font-weight:400;margin:8px 0}.choices input{width:auto;margin-right:8px}a{color:#172b52}@media(max-width:700px){main{margin:12px;padding:22px}}</style></head><body><main><h1>Photo Booths of Dallas</h1><h2>Request a Quote</h2><p class="intro">Tell us about your event! We'll personally respond with availability and pricing.</p>
<form action="https://formsubmit.co/info@photoboothsofdallas.com" method="POST">
<input type="hidden" name="_subject" value="New Photo Booths of Dallas Inquiry">
<input type="hidden" name="_url" value="https://www.photoboothsofdallas.com/request-quote.html">
<input type="hidden" name="_captcha" value="true">

<input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
<label for="name">Your Name *</label><input id="name" name="Name" required autocomplete="name">
<label for="email">Email Address *</label><input id="email" type="email" name="email" required autocomplete="email">
<label for="phone">Phone Number (optional)</label><input id="phone" type="tel" name="Phone" autocomplete="tel">
<label for="date">Event Date *</label><input id="date" type="date" name="Event Date" required>
<fieldset><legend>Type of Event</legend><div class="choices">
<label><input type="radio" name="Event Type" value="Wedding" checked>Wedding</label>
<label><input type="radio" name="Event Type" value="Birthday / Quinceañera">Birthday / Quinceañera</label>
<label><input type="radio" name="Event Type" value="Corporate Event">Corporate Event</label>
<label><input type="radio" name="Event Type" value="School Event">School Event</label>
<label><input type="radio" name="Event Type" value="Other">Other</label>
</div></fieldset>
<fieldset><legend>Photo Booth Preference</legend><div class="choices">
<label><input type="radio" name="Booth Preference" value="Classic Enclosed" checked>Classic Enclosed Photo Booth</label>
<label><input type="radio" name="Booth Preference" value="Open-Air">Open-Air Photo Booth</label>
<label><input type="radio" name="Booth Preference" value="Not Sure">Not Sure Yet</label>
</div></fieldset>
<label for="location">Event Location / Venue</label><input id="location" name="Event Location" placeholder="Venue name or city">
<label for="time">Event Time / Hours Needed</label><input id="time" name="Event Time" placeholder="Example: 6 PM – 9 PM">
<label for="details">Additional Details</label><textarea id="details" name="Additional Details" placeholder="Anything else we should know?"></textarea>
<button type="submit">Send My Inquiry</button>
<p class="small">We personally review and reply to inquiries. Submitting this form does not confirm availability or a booking.</p>
</form></main></body></html>
