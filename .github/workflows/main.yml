name: Deploy Photo Booths of Dallas

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Azure Static Web Apps
    steps:
      - uses: actions/checkout@v4

      - name: Build venue slideshows
        run: node scripts/build-venue-slideshows.js

      - name: Build Audio Guest Book slideshow
        run: node scripts/build-audio-guest-slideshow.js

      - name: Build homepage photo booth picture slideshow
        run: node scripts/build-hero-photo-booth-slideshow.js

      - name: Build main Events slideshow
        run: node scripts/build-events-slideshow.js

      - name: Add Events slideshow to city pages
        run: node scripts/build-city-events-slideshows.js

      - name: Remove duplicate booth sections from city pages
        run: node scripts/remove-duplicate-city-booths.js

      - name: Restore missing Open-Air booth images
        run: node scripts/fix-city-booth-images.js

      - name: Update links to all city pages
        run: node scripts/build-city-links.js

      - name: Add printed photo strip messaging to city pages
        run: node scripts/add-city-print-value.js

      - name: Center headlines on all city pages
        run: node scripts/center-city-headings.js

      - name: Deploy website
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
          skip_app_build: true
